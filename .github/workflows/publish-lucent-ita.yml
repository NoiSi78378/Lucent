name: Publish Lucent ITA Kodi repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "addon.xml"
      - "colors/**"
      - "fonts/**"
      - "language/**"
      - "logos/**"
      - "media/**"
      - "resources/**"
      - "scripts/**"
      - "xml/**"
      - "tools/package_ita.py"
      - "tools/build_repository.py"
      - ".github/workflows/publish-lucent-ita.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lucent-ita-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
      - name: Validate Python and translations
        run: |
          python -m compileall -q scripts tools
          python tools/audit_italian.py > /tmp/lucent-ita-audit.log
          python tools/coverage_italian.py
          python tools/smoke_italian.py
          python tools/test_continue_native.py
          python tools/test_continue_directory.py
          python tools/test_touch_mode.py
      - name: Build independent Kodi skin
        run: |
          mkdir -p "$RUNNER_TEMP/package/skin.lucent.ita"
          cp addon.xml "$RUNNER_TEMP/package/skin.lucent.ita/"
          for d in colors fonts language logos media resources scripts xml; do
            cp -a "$d" "$RUNNER_TEMP/package/skin.lucent.ita/"
          done
          find "$RUNNER_TEMP/package/skin.lucent.ita" -type d -name '__pycache__' -prune -exec rm -rf {} +
          python tools/package_ita.py "$RUNNER_TEMP/package/skin.lucent.ita"
      - name: Build and check repository installer and index
        run: |
          python tools/build_repository.py "$RUNNER_TEMP/package/skin.lucent.ita" "$RUNNER_TEMP/site"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          root = Path(os.environ['RUNNER_TEMP'])/'site'
          p = root/'repo-ita/addons.xml'
          ET.parse(p)
          assert (root/'repo-ita/addons.xml.md5').read_text() == hashlib.md5(p.read_bytes()).hexdigest()
          for x in root.rglob('*.zip'):
              with ZipFile(x) as z:
                  assert z.testzip() is None, str(x)
          print('All website/repository ZIPs and Kodi addons.xml validated')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public URLs as Kodi would access them
        run: |
          python - <<'PY'
          import hashlib, time, urllib.error, urllib.request, xml.etree.ElementTree as ET, io, zipfile
          base="https://noisi78378.github.io/Lucent-ITA/"
          def fetch(path):
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"Kodi/21.0"})
              with urllib.request.urlopen(req, timeout=15) as res:
                  content=res.read()
                  print(res.status, res.headers.get("Content-Type"), len(content), url,flush=True)
                  return content
          for i in range(6):
              try:
                  manifest=fetch("repo-ita/addons.xml")
                  md5=fetch("repo-ita/addons.xml.md5").decode().strip()
                  assert hashlib.md5(manifest).hexdigest()==md5,(md5,hashlib.md5(manifest).hexdigest())
                  ids=[a.attrib["id"] for a in ET.fromstring(manifest)]
                  assert "repository.lucent.ita" in ids and "skin.lucent.ita" in ids,ids
                  repo=fetch("repository.lucent.ita.zip")
                  with zipfile.ZipFile(io.BytesIO(repo)) as archive:
                      assert archive.testzip() is None
                      rx=archive.read("repository.lucent.ita/addon.xml")
                      addon=ET.fromstring(rx)
                      ext=addon.find("./extension[@point='xbmc.addon.repository']")
                      assert ext is not None, "Repository extension missing"
                      dirs=ext.findall("dir")
                      assert len(dirs)==1, "Kodi 20+ needs one <dir> containing repository URLs"
                      directory=dirs[0]
                      urls=[directory.find("info").text, directory.find("checksum").text, directory.find("datadir").text]
                      assert addon.get("version")=="1.0.2", addon.get("version")
                      print("Kodi 20+ repository descriptor URLs:",urls,flush=True)
                      assert all(u.startswith(base) for u in urls)
                  skin_version=next(a.get("version") for a in ET.fromstring(manifest) if a.get("id")=="skin.lucent.ita")
                  skin=fetch(f"repo-ita/zips/skin.lucent.ita/skin.lucent.ita-{skin_version}.zip")
                  with zipfile.ZipFile(io.BytesIO(skin)) as archive:
                      assert archive.testzip() is None
                      assert "skin.lucent.ita/addon.xml" in archive.namelist()
                  print("PASS: Public Kodi repository URLs verified",flush=True)
                  break
              except Exception as error:
                  print("ATTEMPT",i+1,"FAILED:",repr(error),flush=True)
                  if i==5: raise
                  time.sleep(10)
          PY
