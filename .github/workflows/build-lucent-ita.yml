name: Build independent Lucent ITA ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "addon.xml"
      - "scripts/**"
      - "language/resource.language.it_it/**"
      - "tools/package_ita.py"
      - ".github/workflows/build-lucent-ita.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lucent ITA
        uses: actions/checkout@v4
      - name: Check all Python scripts
        run: python -m compileall -q scripts tools
      - name: Check Italian strings and XML
        run: |
          python tools/audit_italian.py
          python tools/coverage_italian.py
      - name: Smoke-test localised setup, menu and info panels
        run: python tools/smoke_italian.py
      - name: Stage only runtime skin folders
        run: |
          mkdir -p "$RUNNER_TEMP/skin-package/skin.lucent.ita"
          cp addon.xml "$RUNNER_TEMP/skin-package/skin.lucent.ita/"
          for d in colors fonts language logos media resources scripts xml; do
            cp -a "$d" "$RUNNER_TEMP/skin-package/skin.lucent.ita/"
          done
          find "$RUNNER_TEMP/skin-package/skin.lucent.ita" \( -name '__pycache__' -o -name '*.pyc' \) -delete
      - name: Convert skin to independent add-on ID
        run: |
          python tools/package_ita.py "$RUNNER_TEMP/skin-package/skin.lucent.ita"
          python -m compileall -q "$RUNNER_TEMP/skin-package/skin.lucent.ita/scripts"
      - name: Package and inspect Kodi-installable ZIP
        run: |
          cd "$RUNNER_TEMP/skin-package"
          zip -q -r "$GITHUB_WORKSPACE/skin.lucent.ita-2.1.45.1.zip" skin.lucent.ita
          unzip -t "$GITHUB_WORKSPACE/skin.lucent.ita-2.1.45.1.zip" | tail -n 1
          unzip -p "$GITHUB_WORKSPACE/skin.lucent.ita-2.1.45.1.zip" skin.lucent.ita/addon.xml | head -n 2
      - name: Upload ZIP for private testing
        uses: actions/upload-artifact@v4
        with:
          name: Lucent-ITA-Kodi-test
          path: skin.lucent.ita-2.1.45.1.zip
          retention-days: 30
          if-no-files-found: error
